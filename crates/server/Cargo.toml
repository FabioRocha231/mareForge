[package]
name = "mareforge-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
bevy = { version = "0.15", default-features = false, features = ["bevy_asset", "bevy_state"] }
lightyear = "0.19"
mareforge-domain-combat = { path = "../domain-combat" }
mareforge-domain-crafting = { path = "../domain-crafting" }
mareforge-domain-economy = { path = "../domain-economy" }
mareforge-domain-items = { path = "../domain-items" }
mareforge-domain-ships = { path = "../domain-ships" }
mareforge-domain-world = { path = "../domain-world" }
mareforge-protocol = { path = "../protocol" }
mareforge-shared = { path = "../shared" }
chrono = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "macros", "uuid", "chrono"] }
tokio = { version = "1", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
crossbeam-channel = "0.5"
mareforge-client = { path = "../client" }
