name: Rename to Marvyr

on:
  push:
    branches:
      - rename-marvyr

permissions:
  contents: write

jobs:
  rename:
    if: "!contains(github.event.head_commit.message, 'chore: rename MareForge to Marvyr')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename-marvyr
          fetch-depth: 0

      - name: Rename paths
        shell: bash
        run: |
          set -euo pipefail
          if [ -d assets/mareforge ]; then
            git mv assets/mareforge assets/marvyr
          fi
          if [ -d crates/tools/mareforge-playtest ]; then
            git mv crates/tools/mareforge-playtest crates/tools/marvyr-playtest
          fi

      - name: Replace MareForge references
        shell: python
        run: |
          from pathlib import Path
          replacements = [
              ("MAREFORGE", "MARVYR"),
              ("MareForge", "Marvyr"),
              ("mareForge", "Marvyr"),
              ("Mareforge", "Marvyr"),
              ("mareforge", "marvyr"),
          ]

          changed = []
          for path in Path(".").rglob("*"):
              if not path.is_file() or ".git" in path.parts:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              updated = text
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding="utf-8")
                  changed.append(str(path))

          print(f"Updated {len(changed)} text files")

      - name: Refresh Cargo lockfile
        run: cargo generate-lockfile

      - name: Format workspace
        run: cargo fmt --all

      - name: Verify legacy references are gone
        shell: bash
        run: |
          set -euo pipefail
          if git grep -ni 'mareforge' -- ':!.github/workflows/rename-marvyr.yml'; then
            echo "Legacy MareForge text references remain"
            exit 1
          fi
          leftovers="$(find . -path './.git' -prune -o -iname '*mareforge*' -print)"
          if [ -n "$leftovers" ]; then
            echo "Legacy MareForge paths remain:"
            echo "$leftovers"
            exit 1
          fi

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/rename-marvyr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: rename MareForge to Marvyr"
          git push origin HEAD:rename-marvyr
